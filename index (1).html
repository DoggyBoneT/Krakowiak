<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Odpuleni Krakowiacy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#12243a;--panel:#1c3556;--line:#2b4a74;--text:#e8f0f7;--muted:#8fa6bf;--amber:#f2b84b;--mint:#5bc0a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
header{padding:12px 18px 0;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;gap:10px}
header button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px}
.balance{text-align:center;padding:6px 0 0}
.balance b{font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--amber)}
.balance small{display:block;color:var(--muted);font-size:15px}
main{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
section{display:none;flex:1;min-height:0}
section.on{display:flex;flex-direction:column}
#play{position:relative;overflow:hidden;touch-action:none;margin:6px 12px;border-radius:18px;background:#8a7a63;border:1px solid var(--line)}
#play canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:1500}
.man{position:absolute;left:0;top:0;width:64px;height:100px;transform-origin:50% 100%;cursor:pointer;touch-action:none}
.man{pointer-events:none}
.man svg{width:100%;height:100%;display:block;overflow:visible}
.lg{transform-origin:50% 40px;animation:run .28s ease-in-out infinite alternate}
.lg.b{animation-direction:alternate-reverse}
@keyframes run{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.arm{animation:swing .28s ease-in-out infinite alternate}
.arm.l{transform-origin:12.3px 20.5px}.arm.r{transform-origin:27.7px 20.5px;animation-direction:alternate-reverse}
@keyframes swing{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
.panic .arm.l{animation:wl .2s ease-in-out infinite alternate}
.panic .arm.r{animation:wr .2s ease-in-out infinite alternate-reverse}
@keyframes wl{from{transform:rotate(135deg)}to{transform:rotate(205deg)}}
@keyframes wr{from{transform:rotate(-135deg)}to{transform:rotate(-205deg)}}
.car{position:absolute;left:0;top:0;width:140px;height:92px;transform-origin:50% 100%;pointer-events:none}
.car svg{width:100%;height:100%;display:block;overflow:visible}
.hl{animation:run .34s ease-in-out infinite alternate}.hl.r{animation-direction:alternate-reverse}
.whl{animation:spin .55s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lj{animation:ljb .34s ease-in-out infinite alternate}@keyframes ljb{to{transform:translateY(-1.5px)}}
.mace{animation:mace .5s ease-in-out infinite alternate;transform-origin:59px 18px}
@keyframes mace{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.splat{position:absolute;width:96px;pointer-events:none;z-index:1;animation:pop .12s ease-out,fade 7s 1.5s forwards}
@keyframes pop{from{opacity:.2}}
@keyframes fade{to{opacity:0}}
.fly{position:absolute;font-weight:800;font-size:24px;color:#fff;pointer-events:none;z-index:1600;animation:fly .8s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.7)}
@keyframes fly{to{transform:translateY(-80px);opacity:0}}
.bags{position:absolute;left:50%;bottom:0;width:130px;height:38px;margin-left:-65px;z-index:1000;border-radius:44px 44px 0 0;background:repeating-linear-gradient(90deg,#b09a62 0 38px,#6f5a32 38px 42px);box-shadow:inset 0 7px 0 rgba(255,255,255,.16),0 -6px 14px rgba(0,0,0,.35);pointer-events:none}
#gun{position:absolute;left:50%;bottom:30px;width:0;height:0;z-index:1001;pointer-events:none}
#gunrot{position:absolute;left:-36px;top:-22px;width:200px;height:44px;transform-origin:36px 22px;transform:rotate(-1.5708rad);filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
#gunrot svg{width:200px;height:44px;display:block;overflow:visible}
#gunrot svg.kick{animation:kick .16s ease-out}
@keyframes kick{0%{transform:translateX(-12px)}100%{transform:none}}
.shake{animation:shake .15s linear}
@keyframes shake{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,2px)}}
.energy{padding:8px 20px 8px}
.energy .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.bar{height:12px;border-radius:6px;background:var(--panel);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c98a1b,var(--amber));transition:width .15s}
#shop{padding:8px 16px;overflow:auto;gap:10px}
.up{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.up .t{flex:1}.up .t b{display:block}.up .t span{color:var(--muted);font-size:13px}
.up button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--amber);color:#3a2706;min-width:92px;font-size:15px}
.up button:disabled{background:var(--line);color:var(--muted)}
nav{display:flex;gap:8px;padding:6px 16px 10px}
nav button{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);font-weight:700;font-size:15px}
nav button.on{background:var(--panel);color:var(--text);border-color:var(--amber)}
.note{color:var(--muted);font-size:12px;text-align:center;padding:2px 16px}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#play{isolation:isolate}
#waveHud{position:absolute;z-index:1700;top:10px;left:50%;transform:translateX(-50%);width:min(230px,68%);padding:9px 14px;border:1px solid #ffffff35;border-radius:15px;background:#101d2dcc;backdrop-filter:blur(10px);text-align:center;pointer-events:none}
#waveHud strong{display:block;font-size:18px;color:#fff}#waveHud small{color:#d7e1eb;font-size:11px}
#bossBar{display:none;position:absolute;z-index:1701;top:76px;left:10%;width:80%;padding:7px 10px;border-radius:12px;background:#140c12dd;border:1px solid #ff6e7877;pointer-events:none}
#bossBar b{display:block;text-align:center;font-size:12px;color:#ffd6d8;margin-bottom:5px}
#bossHealth{height:9px;background:#45232a;border-radius:9px;overflow:hidden}#bossHealth i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#a3132a,#ff6471);transition:width .12s}
#boss{display:none;position:absolute;z-index:1300;left:50%;top:33%;width:126px;height:126px;transform:translate(-50%,-50%);border-radius:40%;background:radial-gradient(circle at 38% 28%,#ff8a7b,#9f1e2b 58%,#3e101d);border:4px solid #ffd0a0;box-shadow:0 0 0 7px #500f153d,0 12px 30px #0006,0 0 30px #ff3c3c80;font-size:76px;line-height:118px;text-align:center;animation:bossFloat 1.15s ease-in-out infinite alternate;pointer-events:none}
@keyframes bossFloat{to{transform:translate(-50%,-55%) scale(1.04)}}#bossName{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;letter-spacing:.1em;color:#fff;white-space:nowrap;text-shadow:0 2px 5px #400}
#shop{display:none;position:absolute!important;z-index:1900;left:10px;bottom:78px;top:auto;width:min(330px,calc(100% - 20px));max-height:65%;overflow:auto;padding:12px;background:#12243af5;border:1px solid #ffffff29;border-radius:18px;box-shadow:0 14px 36px #0006;backdrop-filter:blur(12px)}
#shop.open{display:flex}
#energyBox{position:absolute;z-index:1800;right:12px;bottom:12px;width:145px;padding:8px 10px;border:1px solid #ffffff26;border-radius:13px;background:#101d2dcc;backdrop-filter:blur(8px)}
#energyBox .row{font-size:12px;margin-bottom:4px}#energyBox .bar{height:7px}
#upgradeToggle{position:absolute;z-index:2000;left:12px;bottom:12px;border:1px solid #ffffff38;border-radius:13px;padding:11px 15px;background:#142437e8;color:#f6f8fb;font-size:13px;font-weight:800;box-shadow:0 7px 20px #0004;backdrop-filter:blur(10px)}
#scare{display:none;position:absolute;z-index:2200;inset:0;align-items:center;justify-content:center;background:#6e000fe0;font-size:min(54vw,250px);text-shadow:0 0 35px #ffb0a0;animation:scareIn .22s ease-out}
#scare.show{display:flex;animation:scareIn .22s ease-out,skullLaugh .16s .22s infinite alternate}@keyframes skullLaugh{from{transform:rotate(-7deg) scale(1)}to{transform:rotate(7deg) scale(1.08)}}@keyframes scareIn{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
#bloodWash{position:absolute;z-index:2100;inset:0;opacity:0;pointer-events:none;background:radial-gradient(ellipse at center,#ff192dd1,#5f000cf5)}
#bloodWash.show{animation:bloodBurst 1.1s ease-out forwards}@keyframes bloodBurst{0%{opacity:0}12%{opacity:1}55%{opacity:.9}100%{opacity:0}}
#gunrot svg.kick{animation:weaponKick .2s cubic-bezier(.2,.8,.2,1)}@keyframes weaponKick{0%{transform:translateX(-15px) rotate(-2deg)}45%{transform:translateX(5px) rotate(1deg)}100%{transform:none}}
@media (max-width:380px){#waveHud{top:8px;padding:7px 10px}#boss{width:108px;height:108px;font-size:64px;line-height:100px}#energyBox{width:128px}}
@media (prefers-reduced-motion:reduce){.lg,.arm,.hl,.whl,.lj,.mace{animation:none!important}.splat,.fly,.shake,#gunrot svg.kick{animation-duration:.01s}}
</style>
</head>
<body>
<header><span id="user">Gracz</span><span id="rate">0 / godz.</span><button id="mute" aria-label="Dźwięk">Dźwięk: wł.</button></header>
<div class="balance"><b id="bal">0</b><small>Odpuleni Krakowiacy</small></div>

<main>
  <section id="play" class="on">
    <canvas id="bg"></canvas>
    <div class="bags"></div>
    <div id="gun"><div id="gunrot"><svg viewBox="0 0 200 44">
      <defs><linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6068"/><stop offset="1" stop-color="#2a2d31"/></linearGradient><linearGradient id="wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a30"/><stop offset="1" stop-color="#5a3719"/></linearGradient></defs>
      <path d="M0 17l30-2 4 14-26 4z" fill="url(#wd)"/>
      <path d="M92 26l-8 14M98 26l8 14" stroke="#2a2d31" stroke-width="3" stroke-linecap="round"/>
      <rect x="30" y="15" width="42" height="14" rx="2" fill="url(#mt)"/>
      <rect x="44" y="7" width="26" height="6" rx="3" fill="#1c1e21"/><rect x="48" y="12" width="4" height="4" fill="#1c1e21"/><rect x="62" y="12" width="4" height="4" fill="#1c1e21"/>
      <path d="M44 29h12l3 15H47z" fill="#2a2d31"/>
      <rect x="72" y="16" width="34" height="10" rx="2" fill="url(#wd)"/>
      <rect x="106" y="18" width="46" height="6" fill="url(#mt)"/>
      <rect x="152" y="15" width="14" height="12" rx="2" fill="#15171a"/><path d="M155 17v8M159 17v8M163 17v8" stroke="#444" stroke-width="1"/>
      <rect x="32" y="16" width="38" height="2" fill="rgba(255,255,255,.18)"/>
    </svg></div></div>
    <canvas id="fx"></canvas>
    <div id="waveHud"><strong>0 / 200</strong><small>DO POJAWIENIA SIĘ BOSSA</small></div>
    <div id="bossBar"><b>BOSS · <span id="bossHpText">500 / 500</span></b><div id="bossHealth"><i></i></div></div>
    <div id="boss"><span id="bossName">KRÓL KRAKOWIAKÓW</span>👹</div>
    <div id="bloodWash"></div><div id="scare">💀</div>
    <button id="upgradeToggle" type="button">✦ Ulepszenia</button>
    <div class="energy" id="energyBox"><div class="row"><span id="enl">Naboje</span><span id="en">0/0</span></div><div class="bar"><i id="enbar"></i></div></div>
  </section>
  <section id="shop"></section>
</main>

<div class="note">Gra demonstracyjna – punkty są wirtualne. Żaden prawdziwy Krakowiak nie ucierpiał.</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const u0 = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
if (u0) document.getElementById('user').textContent = u0.first_name;

const KEY = 'krakowiacy_v2';
const UPS = {
  tap:   {name:'Większy Kaliber',   desc:'+1 punkt za trafienie',          base:50,  mult:1.6},
  max:   {name:'Większy magazynek', desc:'+100 maks. nabojów',             base:100, mult:1.7},
  regen: {name:'Szybsze ładowanie', desc:'+1 naboju na sekundę',           base:150, mult:1.8},
  auto:  {name:'Automatyczny walec',desc:'+200 Krakowiaków na godzinę',    base:300, mult:1.9}
};
let S = {coins:0, energy:200, lv:{tap:0,max:0,regen:0,auto:0}, t:Date.now()};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
const perTap = () => 1 + S.lv.tap;
const maxEn  = () => 200 + 100*S.lv.max;
const regen  = () => 2 + S.lv.regen;
const hourly = () => 200*S.lv.auto;
const cost   = k => Math.floor(UPS[k].base * Math.pow(UPS[k].mult, S.lv[k]));
const fmt    = n => Math.floor(n).toLocaleString('pl-PL');
(function(){
  const sec = Math.min((Date.now()-S.t)/1000, 3*3600);
  S.energy = Math.min(maxEn(), S.energy + sec*regen());
  S.coins += sec/3600*hourly();
})();
function save(){ S.t = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function render(){
  document.getElementById('waveHud').querySelector('strong').textContent=boss?'BOSS!':waveKills+' / '+waveGoal;
  document.getElementById('waveHud').querySelector('small').textContent=boss?'POKONAJ GO!':'ETAP '+stage+' · DO POJAWIENIA SIĘ BOSSA';
  document.getElementById('bal').textContent = fmt(S.coins);
  document.getElementById('en').textContent = fmt(S.energy)+'/'+fmt(maxEn());
  document.getElementById('enl').textContent = S.energy < 1 ? 'Brak nabojów – przeładowuję…' : 'Naboje';
  document.getElementById('enbar').style.width = (S.energy/maxEn()*100)+'%';
  document.getElementById('rate').textContent = fmt(hourly())+' / godz.';
  document.querySelectorAll('.up button').forEach(b=>{ b.disabled = S.coins < cost(b.dataset.k); });
}
function renderShop(){
  const el = document.getElementById('shop'); el.innerHTML = '';
  for (const k in UPS){
    const d = document.createElement('div'); d.className = 'up';
    d.innerHTML = '<div class="t"><b>'+UPS[k].name+' (poz. '+S.lv[k]+')</b><span>'+UPS[k].desc+'</span></div><button data-k="'+k+'">'+fmt(cost(k))+'</button>';
    el.appendChild(d);
  }
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k = b.dataset.k, c = cost(k);
    if (S.coins < c) return;
    S.coins -= c; S.lv[k]++;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    renderShop(); render(); save();
  });
}

/* ================= DŹWIĘK (Web Audio, bez plików) ================= */
let AC, NB, WET, muted = false;
function audio(){
  if (!AC){ try{
    AC = new (window.AudioContext||window.webkitAudioContext)(); const sr = AC.sampleRate;
    NB = AC.createBuffer(1, sr, sr); const d = NB.getChannelData(0); for (let i=0;i<sr;i++) d[i] = Math.random()*2-1;
    const ir = AC.createBuffer(2, sr*1.1|0, sr);
    for (let c=0;c<2;c++){ const x = ir.getChannelData(c); for (let i=0;i<x.length;i++) x[i] = (Math.random()*2-1)*Math.pow(1-i/x.length,3.2); }
    const cv = AC.createConvolver(); cv.buffer = ir; WET = AC.createGain(); WET.gain.value = .35; WET.connect(cv); cv.connect(AC.destination);
  }catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev, audio, {passive:true}));
function noise(t, dur, type, f0, f1, vol, rate){
  const s = AC.createBufferSource(); s.buffer = NB; s.playbackRate.value = rate;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); g.connect(WET); s.start(t); s.stop(t+dur+.05);
}
function tone(t, dur, f0, f1, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
function shotSound(){
  if (muted || !audio()) return; const t = AC.currentTime;
  noise(t,.09,'highpass',3500,1200,.9,1+Math.random()*.2);   // trzask
  noise(t,.34,'lowpass',2600,160,1,.8+Math.random()*.2);     // huk
  tone(t,.22,150,38,.9);                                      // uderzenie basu
  noise(t+.02,.05,'bandpass',5000,2500,.25,1.5);              // metaliczny dźwięk zamka
}
function goblin(){
  if (muted || !AC) return; const t = AC.currentTime, n = 3 + (Math.random()*3|0), base = 420 + Math.random()*260;
  for (let i=0;i<n;i++){ const st = t + i*.13, o = AC.createOscillator(); o.type = 'sawtooth';
    const f0 = base*(.85+Math.random()*.4); o.frequency.setValueAtTime(f0,st); o.frequency.exponentialRampToValueAtTime(f0*(.55+Math.random()*.4),st+.1);
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4; bp.frequency.setValueAtTime(900,st); bp.frequency.exponentialRampToValueAtTime(1900,st+.1);
    const g = AC.createGain(); g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(.26,st+.02); g.gain.exponentialRampToValueAtTime(.001,st+.11);
    o.connect(bp); bp.connect(g); g.connect(AC.destination); g.connect(WET); o.start(st); o.stop(st+.13); }
}
function evilLaugh(){
  if(muted || !audio())return;
  const t=AC.currentTime;
  [0,0.16,0.34,0.54,0.78].forEach((d,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(260+(i%2)*90,t+d);
    o.frequency.exponentialRampToValueAtTime(150+(i%2)*55,t+d+.13);
    f.type='bandpass';f.frequency.value=720;f.Q.value=2.2;
    g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.12,t+d+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d+.15);
    o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.16);
  });
}
function shriek(){
  if (muted || !AC) return; const t = AC.currentTime, o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(1100,t); o.frequency.exponentialRampToValueAtTime(180,t+.4);
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.setValueAtTime(2200,t); bp.frequency.exponentialRampToValueAtTime(700,t+.4);
  const g = AC.createGain(); g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.connect(bp); bp.connect(g); g.connect(AC.destination); g.connect(WET); o.start(t); o.stop(t+.45);
}
function bell(){ if (muted || !AC) return; const t = AC.currentTime; [2093,2637,2093].forEach((f,i)=>tone(t+i*.09,.35,f,f*.985,.05)); }
function ricochet(){ if (muted || !AC) return; const t = AC.currentTime; tone(t,.2,2800,800,.1); noise(t,.07,'bandpass',4200,2000,.3,1.4); }
function hitSound(){ if (muted || !AC) return; const t = AC.currentTime; tone(t,.14,110,45,.55); noise(t,.12,'lowpass',900,200,.5,1); }
document.getElementById('upgradeToggle').onclick=()=>{const shop=document.getElementById('shop');shop.classList.toggle('open');document.getElementById('upgradeToggle').textContent=shop.classList.contains('open')?'✕ Zamknij ulepszenia':'✦ Ulepszenia';};
document.getElementById('mute').onclick = e=>{ muted = !muted; e.target.textContent = 'Dźwięk: '+(muted?'wył.':'wł.'); };

/* ================= SCENA: Rynek ================= */
const area = document.getElementById('play');
const bg = document.getElementById('bg'), fx = document.getElementById('fx');
const bx = bg.getContext('2d'), fxc = fx.getContext('2d');
let HZ = 100;
function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function lg(c,x0,y0,x1,y1,st){ const g=c.createLinearGradient(x0,y0,x1,y1); st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s)); return g; }

function drawScene(){

  const t=tgt(m),n=m.pts+S.lv.tap; m.el.remove(); men.splice(men.indexOf(m),1);
  S.coins += n; waveKills++; render(); if(waveKills>=waveGoal&&!boss&&!intermission)summonBoss();
  const cols = ['#b3202a','#8e1520','#d12a35'];
  for (let i=0;i<30;i++){ const a = b.dir + (Math.random()-.5)*2.6, sp = 70+Math.random()*340;
    P({t:'blood', x:t.x, y:t.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40, g:760, life:.45+Math.random()*.55, r:1.2+Math.random()*2.4, c:cols[i%3]}); }
  for (let i=0;i<7;i++) P({t:'smoke', x:t.x, y:t.y+10, vx:(Math.random()-.5)*60, vy:-10-Math.random()*30, life:.5+Math.random()*.4, r:6+Math.random()*6, drag:2, c:'196,170,130'});
  for (let i=0;i<8;i++){ const a = Math.random()*6.28, sp = 150+Math.random()*250; P({t:'spark', x:t.x, y:t.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:.15+Math.random()*.15, r:1.3}); }
  P({t:'ring', x:t.x, y:t.y, life:.3, r:6});
  const s = document.createElement('div'); s.className = 'splat'; s.innerHTML = SPLAT;
  s.style.left = (m.x-48)+'px'; s.style.top = (m.y-44)+'px';
  s.style.transform = 'rotate('+(Math.random()*360)+'deg) scale('+(m.s*(.9+Math.random()*.4))+')';
  area.appendChild(s); setTimeout(()=>s.remove(), 8700);
  const f = document.createElement('div'); f.className = 'fly'; f.textContent = '+'+n; f.style.color = m.type==='k'?'#ffd34d':m.type==='w'?'#ff9ac4':'#fff'; if (m.type==='k') f.style.fontSize = '32px'; f.style.left = (t.x-12)+'px'; f.style.top = (t.y-46)+'px';
  area.appendChild(f); setTimeout(()=>f.remove(), 800);
  area.classList.remove('shake'); void area.offsetWidth; area.classList.add('shake');
  hitSound();
  const nt = performance.now(); men.forEach(q=>{ if (q.dead) return; q.panicUntil = nt+1600; q.nextPanic = nt+4200+Math.random()*3000; q.el.firstChild.classList.add('panic'); });
  if (m.type === 'k') shriek();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  render();
}
function summonBoss(){
  if(boss||intermission)return;men.forEach(m=>m.el.remove());men.length=0;
  boss={isBoss:true,x:area.clientWidth/2,y:area.clientHeight*.36,r:68,hp:500,maxHp:500};
  const el=document.getElementById('boss');el.style.display='block';el.style.left=boss.x+'px';el.style.top=boss.y+'px';
  document.getElementById('bossBar').style.display='block';document.getElementById('bossHpText').textContent='500 / 500';document.querySelector('#bossHealth i').style.width='100%';goblin();render();
}
function defeatBoss(){
  if(!boss)return;boss=null;intermission=true;document.getElementById('boss').style.display='none';document.getElementById('bossBar').style.display='none';
  const wash=document.getElementById('bloodWash'),scare=document.getElementById('scare');wash.classList.remove('show');void wash.offsetWidth;wash.classList.add('show');
  for(let i=0;i<260;i++){const a=Math.random()*6.28,sp=80+Math.random()*560;P({t:'blood',x:area.clientWidth/2,y:area.clientHeight/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-100,g:360,life:1.1+Math.random()*1.4,r:2+Math.random()*4,c:['#9e071e','#d21e38','#5e0715'][i%3]});}
  scare.classList.add('show');shriek();evilLaugh();setTimeout(()=>scare.classList.remove('show'),1350);
  setTimeout(()=>{stage++;waveGoal=Math.ceil(waveGoal*1.2);waveKills=0;intermission=false;nextSpawn=performance.now()+500;render();},2600);render();
}
function drawFx(dt){
  const w = area.clientWidth, h = area.clientHeight, c = fxc; c.clearRect(0,0,w,h);
  for (let i=bul.length-1;i>=0;i--){
    const b = bul[i], t = b.m ? tgt(b.m) : {x:b.tx, y:b.ty}, dx = t.x-b.x, dy = t.y-b.y, d = Math.hypot(dx,dy)||1, st = BS*dt;
    b.trail.push([b.x,b.y]); if (b.trail.length > 8) b.trail.shift();
    if (d <= st+8){ if (b.m) (b.m.isCar ? carHit(b) : impact(b)); else miss(b); bul.splice(i,1); continue; }
    b.x += dx/d*st; b.y += dy/d*st;
    const t0 = b.trail[0]; c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
    let g = c.createLinearGradient(t0[0],t0[1],b.x,b.y); g.addColorStop(0,'rgba(255,150,40,0)'); g.addColorStop(1,'rgba(255,170,60,.35)');
    c.strokeStyle = g; c.lineWidth = b.th*3.2; c.beginPath(); c.moveTo(t0[0],t0[1]); c.lineTo(b.x,b.y); c.stroke();
    g = c.createLinearGradient(t0[0],t0[1],b.x,b.y); g.addColorStop(0,'rgba(255,220,120,0)'); g.addColorStop(1,'rgba(255,250,215,1)');
    c.strokeStyle = g; c.lineWidth = b.th; c.beginPath(); c.moveTo(t0[0],t0[1]); c.lineTo(b.x,b.y); c.stroke();
    g = c.createRadialGradient(b.x,b.y,0,b.x,b.y,b.th*3.4); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.4,'rgba(255,200,90,.7)'); g.addColorStop(1,'rgba(255,140,30,0)');
    c.fillStyle = g; c.beginPath(); c.arc(b.x,b.y,b.th*3.4,0,7); c.fill();
  }
  for (let i=par.length-1;i>=0;i--){
    const p = par[i]; p.life -= dt; if (p.life <= 0){ par.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; if (p.drag){ const k = Math.max(0,1-p.drag*dt); p.vx *= k; p.vy *= k; }
    const k = p.life/p.max;
    if (p.t === 'smoke'){ const r = p.r*(1+(1-k)*2.4), g = c.createRadialGradient(p.x,p.y,0,p.x,p.y,r); const col = p.c || '226,226,226';
      g.addColorStop(0,'rgba('+col+','+(.5*k)+')'); g.addColorStop(1,'rgba('+col+',0)'); c.globalCompositeOperation='source-over'; c.fillStyle = g; c.beginPath(); c.arc(p.x,p.y,r,0,7); c.fill(); }
    else if (p.t === 'blood'){ c.globalCompositeOperation='source-over'; c.globalAlpha = Math.min(1,k+.3); c.strokeStyle = p.c; c.lineWidth = p.r*2; c.lineCap='round'; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.vx*.014,p.y-p.vy*.014); c.stroke(); c.globalAlpha = 1; }
    else if (p.t === 'spark'){ c.globalCompositeOperation='lighter'; c.strokeStyle = 'rgba(255,'+(170+k*70|0)+',80,'+k+')'; c.lineWidth = p.r; c.lineCap='round'; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.vx*.03,p.y-p.vy*.03); c.stroke(); }
    else if (p.t === 'shell'){ p.rot += p.vr*dt; c.globalCompositeOperation='source-over'; c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.globalAlpha = Math.min(1,k*2); c.fillStyle = '#e0b44a'; c.fillRect(-3.5,-1.6,7,3.2); c.fillStyle = '#fff3b0'; c.fillRect(-3.5,-1.6,7,1); c.restore(); c.globalAlpha = 1; }
    else if (p.t === 'coin'){ p.rot += p.vr*dt; c.globalCompositeOperation='source-over'; c.globalAlpha = Math.min(1,k*2); c.fillStyle = '#f4c542'; c.strokeStyle = '#a8741a'; c.lineWidth = .8; c.beginPath(); c.ellipse(p.x,p.y,Math.max(.5,p.r*Math.abs(Math.cos(p.rot))),p.r,0,0,7); c.fill(); c.stroke(); c.globalAlpha = 1; }
    else if (p.t === 'conf'){ p.rot += p.vr*dt; c.globalCompositeOperation='source-over'; c.globalAlpha = Math.min(1,k*2); c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle = p.c; c.fillRect(-2.5,-1.2,5,2.4); c.restore(); c.globalAlpha = 1; }
    else if (p.t === 'hole'){ c.globalCompositeOperation='source-over'; c.globalAlpha = Math.min(1,k*2.2);
      let g = c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*1.7); g.addColorStop(0,'rgba(15,9,4,.95)'); g.addColorStop(.55,'rgba(25,15,8,.8)'); g.addColorStop(1,'rgba(25,15,8,0)'); c.fillStyle = g; c.beginPath(); c.arc(p.x,p.y,p.r*1.7,0,7); c.fill();
      c.strokeStyle = 'rgba(235,222,190,.6)'; c.lineWidth = 1.2; c.beginPath(); c.arc(p.x,p.y,p.r*1.05,.4,4.2); c.stroke();
      c.strokeStyle = 'rgba(40,28,16,.6)'; c.lineWidth = .8; for (const a of p.cr){ c.beginPath(); c.moveTo(p.x+Math.cos(a)*p.r,p.y+Math.sin(a)*p.r); c.lineTo(p.x+Math.cos(a)*p.r*2.3,p.y+Math.sin(a)*p.r*2.3); c.stroke(); }
      c.globalAlpha = 1; }
    else if (p.t === 'ring'){ c.globalCompositeOperation='lighter'; c.strokeStyle = 'rgba(255,240,200,'+(k*.8)+')'; c.lineWidth = 2.5*k+.5; c.beginPath(); c.arc(p.x,p.y,p.r+(1-k)*42,0,7); c.stroke(); }
  }
  if (flash > 0){
    flash -= dt/.09; const k = Math.max(0,flash); c.globalCompositeOperation = 'lighter';
    let g = c.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,230); g.addColorStop(0,'rgba(255,190,90,'+(.3*k)+')'); g.addColorStop(1,'rgba(255,150,60,0)'); c.fillStyle = g; c.fillRect(0,0,w,h);
    g = c.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,46*k+6); g.addColorStop(0,'rgba(255,255,235,1)'); g.addColorStop(.5,'rgba(255,200,80,.8)'); g.addColorStop(1,'rgba(255,120,20,0)'); c.fillStyle = g; c.beginPath(); c.arc(fl.x,fl.y,46*k+6,0,7); c.fill();
    c.fillStyle = 'rgba(255,225,130,'+(.9*k)+')';
    for (let i=0;i<7;i++){ const a = fl.a+(Math.random()-.5)*1.1, L = (40+Math.random()*60)*k, wd = .13;
      c.beginPath(); c.moveTo(fl.x+Math.cos(a-wd)*6,fl.y+Math.sin(a-wd)*6); c.lineTo(fl.x+Math.cos(a)*L,fl.y+Math.sin(a)*L); c.lineTo(fl.x+Math.cos(a+wd)*6,fl.y+Math.sin(a+wd)*6); c.fill(); }
  }
  c.globalCompositeOperation = 'source-over';
}

/* ================= PĘTLA ================= */
let lastT = performance.now();
function frame(now){
  const dt = Math.min((now-lastT)/1000, .05); lastT = now;
  const w = area.clientWidth, y0 = Y0(), y1 = Y1();
  if (w > 0){
    if(!boss&&!intermission&&men.length<MAX_MEN&&now>nextSpawn){spawn();nextSpawn=now+250+Math.random()*500;}
    if(boss){boss.x=area.clientWidth/2+Math.sin(now/650)*Math.min(36,area.clientWidth*.08);boss.y=area.clientHeight*.36+Math.sin(now/420)*7;const be=document.getElementById('boss');be.style.left=boss.x+'px';be.style.top=boss.y+'px';}
    for (const m of men){
      if (now > m.turn) newDir(m);
      if (m.type === 'k' && Math.random() < dt*1.3){ m.vx *= -1; m.vy = (Math.random()-.5)*320; }
      const sv = m.el.firstChild;
      if (now > m.nextPanic){ m.panicUntil = now+900+Math.random()*900; m.nextPanic = m.panicUntil+2200+Math.random()*4200; sv.classList.add('panic'); }
      if (m.panicUntil && now > m.panicUntil){ m.panicUntil = 0; sv.classList.remove('panic'); }
      if (m.type === 'k' && !m.dead && now > m.nextSound){ goblin(); m.nextSound = now+3500+Math.random()*5000; }
      m.s = sc(m.y)*m.k;
      const pm = m.panicUntil ? 1.25 : 1; m.x += m.vx*dt*m.s*pm; m.y += m.vy*dt*m.s*pm;
      if (m.x < 32*m.s){ m.x = 32*m.s; m.vx = Math.abs(m.vx); }
      if (m.x > w-32*m.s){ m.x = w-32*m.s; m.vx = -Math.abs(m.vx); }
      if (m.y < y0){ m.y = y0; m.vy = Math.abs(m.vy); }
      if (m.y > y1){ m.y = y1; m.vy = -Math.abs(m.vy); }
      m.el.style.transform = 'translate('+(m.x-W/2)+'px,'+(m.y-H)+'px) scale('+m.s+')';
      m.el.style.zIndex = 2 + (m.y|0);
      m.el.firstChild.style.transform = m.vx < 0 ? 'scaleX(-1)' : '';
    }
    if (!car && now > nextCar) spawnCar();
    if (car) updateCar(dt, now);
    drawFx(dt);
  }
  requestAnimationFrame(frame);
}
area.addEventListener('pointerdown', ev=>{ ev.preventDefault(); audio(); const r = area.getBoundingClientRect(); shoot(ev.clientX-r.left, ev.clientY-r.top); });
requestAnimationFrame(frame);

let last = Date.now();
setInterval(()=>{
  const now = Date.now(), dt = (now-last)/1000; last = now;
  S.energy = Math.min(maxEn(), S.energy + regen()*dt);
  S.coins += hourly()/3600*dt;
  render();
}, 250);
setInterval(save, 5000);
document.addEventListener('visibilitychange', save);
